name: Build Khelo & Jeeto APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - run: flutter create . --org com.khelojeeto --project-name khelo_jeeto
      - run: sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
      - run: |
          rm -rf android/app/src/main/kotlin/com/khelojeeto/khelo_jeeto
          mkdir -p android/app/src/main/kotlin/com/khelojeeto/app
          printf "package com.khelojeeto.app\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity: FlutterActivity()\n" > android/app/src/main/kotlin/com/khelojeeto/app/MainActivity.kt
      - run: keytool -genkey -v -keystore android/app/khelo-jeeto-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias khelojeeto -storepass KheloJeeto2026 -keypass KheloJeeto2026 -dname "CN=Khelo Jeeto, OU=Mobile, O=NexGen Games Studio, L=India, ST=UP, C=IN"
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: khelo-jeeto-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            android/app/khelo-jeeto-release.jks
